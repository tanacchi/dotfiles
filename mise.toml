[settings]
lockfile = true

[tools]
bat = "latest"
bun = "1"
delta = "latest"
deno = "2"
fd = "latest"
fzf = "latest"
github-cli = "latest"
jq = "latest"
node = "24"
pipx = "latest"
pnpm = "latest"
poetry = "latest"
python = "3.13"
ripgrep = "latest"
ruff = "latest"
shellcheck = "latest"
# shfmt 3.13+ dropped sha256sums.txt; older mise/aqua registries fail to install it.
# Keep this pinned until the bootstrap path reliably upgrades mise before tool install.
shfmt = "3.12.0"
starship = "latest"
uv = "latest"
vim = "9.1"
yq = "latest"

[tasks.doctor]
description = "Check the dotfiles runtime prerequisites"
run = '''
#!/usr/bin/env bash
set -euo pipefail

required=(bash git curl vim)
optional=(mise fzf rg fd bat delta shellcheck shfmt starship)

for cmd in "${required[@]}"; do
  command -v "$cmd" >/dev/null || {
    echo "missing required command: $cmd" >&2
    exit 1
  }
done

for cmd in "${optional[@]}"; do
  if ! command -v "$cmd" >/dev/null; then
    echo "missing optional command: $cmd"
  fi
done

vim --version | head -n 1
if command -v mise >/dev/null; then
  mise --version
fi
'''

[tasks.install]
description = "Install or refresh managed tools"
run = "mise install"

[tasks.update]
description = "Upgrade managed tools and Vim plugins"
run = [
  "mise upgrade",
  "vim +'PlugUpgrade' +'PlugUpdate --sync' +qa",
]

[tasks."vim:plugins"]
description = "Install or update Vim plugins"
run = "vim +'PlugInstall --sync' +qa"

[tasks."lint:shell"]
description = "Lint shell scripts and shell dotfiles"
run = '''
#!/usr/bin/env bash
set -euo pipefail

files=(.bashrc .bash_aliases)
while IFS= read -r file; do
  files+=("$file")
done < <(find scripts -type f \( -name '*.sh' -o -name '*.bash' \) | sort)

shellcheck -s bash "${files[@]}"
'''
